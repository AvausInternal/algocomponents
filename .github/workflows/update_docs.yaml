name: Deploy algocomponents docs to Azure Blob Storage

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme pandas scipy 
          
      - name: Build Docs
        working-directory: ./docs
        run: |
          make clean # Clean the built docs
          make html  # Build the HTML documentation

      - name: Deploy to Azure Blob Storage ($web)
        working-directory: ./docs
        env:
          AZURE_STORAGE_ACCOUNT_NAME: "algocomponentsdocs"
        run: |
          az storage blob upload-batch \
            -s _build/html \
            -d '$web' \
            --account-name $AZURE_STORAGE_ACCOUNT_NAME \
            --auth-mode login \
            --overwrite
