name: Deploy algocomponents docs to GCP bucket

on:
  push:
    branches: ["develop", "feature/ci-cd-documentation", "main"]
  pull_request:
    branches: ["develop", "feature/ci-cd-documentation", "main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BUCKET_NAME: "algocomponents-docs"

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Auth with GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme pandas scipy 
          # Scipy and pandas are dependencies from which Sphinx takes some docstrings during docs build.

      - name: Build Docs
        working-directory: ./docs
        run: |
          make clean # Clean the built docs
          make html  # Build the HTML documentation

      - name: Sync docs to GCS
        working-directory: ./docs
        run: |
          # using rsync to sync the built docs to the GCS bucket
          gsutil -m rsync -r -d ./_build/html gs://${{ env.BUCKET_NAME }}/
